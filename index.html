<style>

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{background:var(--bg);font-family:'Cairo','Segoe UI',system-ui,sans-serif;color:var(--text);}
  body{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
  input[type=number]{-moz-appearance:textfield;}
  button{font-family:inherit;cursor:pointer;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .hd-btn{background:none;border:none;padding:4px;display:flex;flex-direction:column;gap:4.5px;}
  .hd-btn span{width:22px;height:2.5px;border-radius:2px;display:block;}
  #app{padding:16px;padding-bottom:92px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;display:inline-block;}
  .navbtn{flex:1;padding:12px 0 16px;background:none;border:none;border-top:2px solid transparent;font-weight:800;font-size:11px;color:var(--mut);}
  .navbtn.on{color:var(--red);border-top-color:var(--red);}
  .navbtn div{font-size:20px;}
  .b{border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;border:1.5px solid var(--red);color:var(--red);background:transparent;transition:all .2s;}
  .b.on{background:var(--red);color:#fff;}
  .b.sm{background:var(--salmon);color:transparent;} /* placeholder, set inline */
  .art{width:100%;height:92px;border-radius:12px;background:#F5F1EA;border:2px solid rgba(217,142,117,.4);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden;}
  .wart{width:84px;height:68px;border-radius:10px;background:#F5F1EA;border:2px solid rgba(217,142,117,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .wt{width:64px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--red);font-weight:900;font-size:18px;text-align:center;padding:8px 4px;font-family:inherit;outline:none;}

/* ---------- التخزين (localStorage) ---------- */
function todayKey(){return new Date().toISOString().slice(0,10);}
var state=load();
function load(){
  try{var r=localStorage.getItem("td-state");if(r)return JSON.parse(r);}catch(e){}
  return{log:{},weights:{},meals:{},med:{enabled:false,day:null,log:{}},anchor:null,name:0};
}
function save(){try{localStorage.setItem("td-state",JSON.stringify(state));}catch(e){}}

/* ---------- حساب اليوم ---------- */
function cycleIndex(){
  if(state.anchor){
    var diff=Math.floor((new Date(todayKey())-new Date(state.anchor.date))/86400000);
    return((state.anchor.idx+diff)%7+7)%7;
  }
  var base=new Date("2026-07-27");
  var d=Math.floor((new Date(todayKey())-base)/86400000);
  return(d%7+7)%7;
}
function streak(){
  var s=0,d=new Date();
  for(var i=0;i<365;i++){
    var k=d.toISOString().slice(0,10);
    var idx=((Math.floor((new Date(k)-new Date("2026-07-27"))/86400000))%7+7)%7;
    var isRest=PROGRAM[idx].rest;
    if(state.log[k]||(isRest&&i!==0))s++;
    else if(i===0){}else break;
    d.setDate(d.getDate()-1);
  }
  return s;
}
function weekCount(types){
  return Object.keys(state.log).filter(function(k){
    var diff=(new Date()-new Date(k))/86400000;
    return diff<7&&types.indexOf(state.log[k])>-1;
  }).length;
}
function markToday(type){
  var cur=state.log[todayKey()],val=type;
  if((cur==="gym"&&type==="cardio")||(cur==="cardio"&&type==="gym"))val="both";
  if(cur==="both")val="both";
  state.log[todayKey()]=val;save();render();
}

function medCard(){
  var med=state.med||{enabled:false,day:null,log:{}};
  var todayDow=new Date().getDay();
  var isInj=med.enabled&&med.day===todayDow;
  var taken=med.log&&med.log[todayKey()];
  var weeks=med.log?Object.keys(med.log).length:0;
  var last=med.log?Object.keys(med.log).sort().pop():null;
  if(!med.enabled){
    var btns="";
    DAYS.forEach(function(d,i){btns+='<button class="js-medday" data-d="'+i+'" style="'+bStyle(false,C.mut)+';padding:6px 10px;font-size:11px">'+d+'</button>';});
    return '<div class="card" style="border-style:dashed;opacity:.85"><div style="font-weight:800;font-size:15px">💉 الإبرة الأسبوعية</div>'+
      '<div style="font-size:12px;color:'+C.mut+';margin-top:6px;line-height:1.8">جاهز للتفعيل — يوم يصرفه لك الدكتور، اختر يوم الإبرة الأسبوعي:</div>'+
      '<div style="display:flex;gap:4px;margin-top:10px;flex-wrap:wrap">'+btns+'</div></div>';
  }
  var dots="";
  for(var w=1;w<=8;w++){dots+='<div style="flex:1;height:8px;border-radius:4px;background:'+(w<=weeks?C.green:C.card2)+';border:1px solid '+(w<=weeks?C.green:C.line)+'"></div>';}
  var status=taken?'✅ انحفظت — خذيتها اليوم':(isInj?'🔔 اليوم يوم الإبرة!':(last?'آخر مرة: '+last:'لسا ما بديت'));
  return '<div class="card" style="border-color:'+((isInj&&!taken)?C.red:C.green+'44')+';background:'+((isInj&&!taken)?C.red+'12':C.card)+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center"><div>'+
    '<div style="font-weight:800;font-size:15px">💉 الإبرة — كل '+DAYS[med.day]+'</div>'+
    '<div style="font-size:12px;color:'+(taken?C.green:C.mut)+';margin-top:4px;font-weight:'+(taken?800:400)+'">'+status+'</div></div>'+
    (taken?'':'<button class="js-medtake" style="'+bStyle(false,C.green)+'">✅ خذيتها</button>')+'</div>'+
    '<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:11px;color:'+C.mut+';font-weight:700">الالتزام</span><span style="font-size:12px;font-weight:900;color:'+C.green+'">'+weeks+' '+(weeks===1?'أسبوع':'أسابيع')+' 🔥</span></div>'+
    '<div style="display:flex;gap:5px">'+dots+'</div>'+
    '<div style="font-size:10px;color:'+C.mut+';margin-top:6px">'+((taken||!isInj)?'الياية: '+DAYS[med.day]+' الياي':'')+'</div></div>'+
    '<div style="display:flex;gap:12px;margin-top:8px">'+
    (taken?'<button class="js-medundo" style="background:none;border:none;color:'+C.mut+';font-size:10px;padding:0">↩︎ تراجع</button>':'')+
    '<button class="js-medoff" style="background:none;border:none;color:'+C.mut+';font-size:10px;padding:0">تعطيل</button></div></div>';
}

function warmupView(){
  var h='<button class="js-home" style="'+bStyle(false,C.mut)+';margin-bottom:12px">→ رجوع</button>'+
   '<div style="font-size:22px;font-weight:900;margin-bottom:12px">الإحماء قبل التمرين 🔥</div>'+
   '<div class="card" style="background:'+C.red+'10;border-color:'+C.red+'44"><div style="font-weight:800;font-size:14px;margin-bottom:6px">① كارديو خفيف 5-10 دقايق</div><div style="font-size:12px;color:'+C.mut+';line-height:1.8">سير، أوبتكال، أو دراجة — الهدف رفع حرارة الجسم بس، مو تعب.</div></div>'+
   '<div class="card" style="background:'+C.salmon+'10;border-color:'+C.salmon+'44"><div style="font-weight:800;font-size:14px;margin-bottom:6px">② تمارين هوائية بدون أوزان</div><div style="font-size:12px;color:'+C.mut+';line-height:1.8">15-20 عدّة لكل تمرين — ضخ الدم في العضلات اللي بتمرنها اليوم.</div></div>';
  WARMUPS.forEach(function(sec){
    h+='<div style="font-size:13px;font-weight:900;color:'+C.salmon+';margin:14px 4px 8px">'+sec.g+'</div>';
    sec.items.forEach(function(w){
      h+='<div class="card" style="padding:12px"><div style="display:flex;align-items:center;gap:12px">'+warmArt(w.k)+
         '<div style="flex:1"><div style="font-weight:800;font-size:14px">'+w.n+'</div><div style="display:flex;gap:6px;margin-top:6px">'+tag("15-20 عدّة",C.salmon)+'</div></div></div></div>';
    });
  });
  h+='<div class="card"><div style="font-size:12px;color:'+C.mut+';line-height:1.9">⚡ إحماء زين = أداء أقوى وإصابات أقل. لا تدخل على الأوزان الثقيلة وجسمك بارد أبداً.</div></div>';
  return h;
}

var NAV=[{id:"home",icon:"⌖",label:"الرئيسية"},{id:"workout",icon:"🏋️",label:"التمرين"},{id:"cardio",icon:"🏃",label:"الكارديو"},{id:"diet",icon:"🍗",label:"الأكل"}];

function render(){
  var body="";
  if(tab==="warmup")body=warmupView();
  else if(tab==="home")body=homeView();
  else if(tab==="workout")body=workoutView();
  else if(tab==="cardio")body=cardioView();
  else if(tab==="diet")body=dietView();

  var nameTxt=state.name?"حمد الوهيبي":"حمد الدرعي";
  var nav="";
  NAV.forEach(function(t){nav+='<button class="navbtn js-nav '+(tab===t.id?"on":"")+'" data-t="'+t.id+'"><div>'+t.icon+'</div>'+t.label+'</button>';});

  var menu="";
  if(menuOpen){
    menu='<div class="js-menuclose" style="position:fixed;inset:0;background:#000A;z-index:40;display:flex;justify-content:flex-end">'+
      '<div style="width:240px;background:'+C.card+';height:100%;padding:20px;border-left:1px solid '+C.line+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div style="font-weight:900;font-size:15px;direction:ltr">TARGET <span style="color:'+C.red+'">⌖</span></div>'+
      '<button class="js-menuclose" style="background:none;border:none;color:'+C.mut+';font-size:20px">✕</button></div>'+
      '<button class="js-mwarm" style="'+bStyle(tab==="warmup")+';width:100%;text-align:right;margin-bottom:10px">🔥 تمارين الإحماء</button>'+
      '<button class="js-mwork" style="'+bStyle(false,C.salmon)+';width:100%;text-align:right;margin-bottom:10px">🏋️ جدول التمرين</button>'+
      '<button class="js-mdiet" style="'+bStyle(false,C.mut)+';width:100%;text-align:right">🍗 البرنامج الغذائي</button></div></div>';
  }

  document.getElementById("root").innerHTML=
   '<div style="padding:16px 16px 12px;border-bottom:1px solid '+C.line+';background:linear-gradient(180deg,'+C.redDark+'18,transparent);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;gap:6px">'+
   '<span style="position:absolute;left:16px;top:18px">'+flag()+'</span>'+
   '<button class="hd-btn js-menu" style="position:absolute;right:16px;top:16px"><span style="background:'+C.text+'"></span><span style="background:'+C.red+'"></span><span style="background:'+C.text+'"></span></button>'+
   '<div style="font-size:18px;font-weight:900;letter-spacing:2px;direction:ltr;width:100%;text-align:center">TARGET <span style="color:'+C.red+'">DESTROY</span> <span style="color:'+C.red+'">⌖</span></div>'+
   '<div class="js-name" style="font-size:13px;color:'+C.salmon+';font-weight:700;cursor:pointer;width:100%;text-align:center;letter-spacing:.5px">'+nameTxt+'</div></div>'+
   '<div id="app">'+body+'</div>'+
   '<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:'+C.card+'F2;backdrop-filter:blur(16px);border-top:1px solid '+C.line+'">'+nav+'</div>'+
   menu;
  wire();
}

/* ================= الأحداث ================= */
function on(cls,fn){[].forEach.call(document.querySelectorAll(cls),function(el){el.addEventListener("click",fn);});}
function wire(){
  on(".js-nav",function(){tab=this.dataset.t;if(tab!=="workout")selDay=null;render();});
  on(".js-name",function(){state.name=state.name?0:1;save();render();});
  on(".js-menu",function(){menuOpen=true;render();});
  on(".js-menuclose",function(e){if(e.target.classList.contains("js-menuclose")){menuOpen=false;render();}});
  on(".js-mwarm",function(){tab="warmup";selDay=null;menuOpen=false;render();});
  on(".js-mwork",function(){tab="workout";selDay=null;menuOpen=false;render();});
  on(".js-mdiet",function(){tab="diet";menuOpen=false;render();});
  on(".js-home",function(){tab="home";render();});
  on(".js-open",function(){selDay=PROGRAM[cycleIndex()];tab="workout";render();});
  on(".js-gym",function(){markToday("gym");});
  on(".js-cardio",function(){markToday("cardio");});
  on(".js-rest",function(){markToday("rest");});
  on(".js-diet",function(){tab="diet";render();});
  on(".js-day",function(){state.anchor={date:todayKey(),idx:+this.dataset.i};save();render();});
  on(".js-openday",function(){var id=+this.dataset.id;selDay=PROGRAM.filter(function(d){return d.id===id;})[0];render();});
  on(".js-back",function(){selDay=null;render();});
  on(".js-meal",function(){var id=this.dataset.id;var mt=state.meals[todayKey()]||{};mt[id]=!mt[id];state.meals[todayKey()]=mt;save();render();});
  on(".js-medday",function(){state.med={enabled:true,day:+this.dataset.d,log:{}};save();render();});
  on(".js-medtake",function(){state.med.log=state.med.log||{};state.med.log[todayKey()]=true;save();render();});
  on(".js-medundo",function(){delete state.med.log[todayKey()];save();render();});
  on(".js-medoff",function(){state.med={enabled:false,day:null,log:state.med.log};save();render();});
  [].forEach.call(document.querySelectorAll(".js-wt"),function(el){
    el.addEventListener("input",function(){state.weights[this.dataset.en]=this.value;save();});
  });
}

render();
</script>
</body>
</html>
